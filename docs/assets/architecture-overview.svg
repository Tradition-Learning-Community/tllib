<title id="title">Architecture de tllib : une implémentation C++20, deux interfaces</title>
<desc id="desc">Le snapshot scientifique verrouillé guide le noyau C++20 et le runtime. L'API native C++ et les bindings Python donnent accès au même moteur. Conformance, données, performance, distribution et documentation sont transversaux.</desc>
