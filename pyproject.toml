[build-system]
requires = ["scikit-build-core>=0.11,<1"]
build-backend = "scikit_build_core.build"

[project]
name = "tllib"
version = "0.1.0"
description = "Tradition Learning C++20 runtime and typed Python facade (foundation only)"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Tradition Learning Community ASBL"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: C++",
]
[tool.scikit-build]
cmake.version = ">=3.27"
wheel.packages = ["bindings/python/tllib"]
sdist.include = ["CMakeLists.txt", "cmake/**", "include/**", "bindings/**", "README.md", "LICENSE", "NOTICE"]

[tool.scikit-build.cmake.define]
TLLIB_BUILD_PYTHON_PROVIDER_BRIDGE = "ON"
BUILD_TESTING = "OFF"
