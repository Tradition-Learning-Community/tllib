name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read pinned specs SHA
        id: specs
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          lock = json.loads(Path("specs.lock.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"sha={lock['sha']}\n")
          PY

      - name: Check out pinned specifications
        uses: actions/checkout@v4
        with:
          repository: Tradition-Learning-Community/tllib-specs
          ref: ${{ steps.specs.outputs.sha }}
          path: tllib-specs

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.9"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Verify specification lock
        env:
          TLLIB_SPECS_ROOT: ${{ github.workspace }}/tllib-specs
        run: uv run python -m tllib.specs verify

      - name: Smoke import
        run: uv run python -c "import tllib"

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Check pinned catalog qualification
        env:
          TLLIB_SPECS_ROOT: ${{ github.workspace }}/tllib-specs
        run: >-
          uv run python -m tllib.conformance
          --handoff tllib-specs/handoff
          --bindings conformance/domains
          --report build/coverage.json

      - name: Build package
        run: uv build
