name: Binder comparison spike
on:
  pull_request:
    paths:
      - 'spikes/binders/**'
      - '.github/workflows/binder-spike.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binder-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install explicit spike-only dependencies and log versions
        run: |
          python -m pip install 'nanobind==2.15.0' 'pybind11==3.1.0' 'numpy==2.5.4'
          python -m pip freeze | grep -E '^(nanobind|pybind11|numpy)=='
      - name: Configure both identical C++20 binding surfaces
        run: |
          cmake -S spikes/binders -B build/spike -DCMAKE_BUILD_TYPE=Release -Dnanobind_DIR="$(python -m nanobind --cmake_dir)" -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
      - name: Measure build wall time and extension size
        run: python spikes/binders/build_and_measure.py build/spike
      - name: Validate value, Result error, enums, NumPy no-copy and callbacks; measure calls/RSS
        run: PYTHONPATH=build/spike python spikes/binders/smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true
        with:
          if-no-files-found: warn
          name: tllib-binder-spike-linux-py312
          path: |
            spikes/binders/build-results.json
            spikes/binders/runtime-results.json
