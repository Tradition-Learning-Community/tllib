name: Source quality (changed files)
on:
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'bindings/python/**'
      - 'include/tllib/**'
      - '.clang-format'
      - 'ruff.toml'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/quality.yml'
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'bindings/python/**'
      - 'include/tllib/**'
      - '.clang-format'
      - 'ruff.toml'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/quality.yml'
permissions:
  contents: read
jobs:
  changed-source-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install and identify tooling
        run: |
          python -m pip install ruff==0.14.1 clang-format==18.1.8
          ruff --version
          clang-format --version
          if ! command -v clang-tidy-18 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang-tidy-18
          fi
          clang-tidy-18 --version
      - name: Lint touched Python and format touched C++ lines without mass rewrite
        run: python3 tools/quality_check.py --base HEAD^
      - name: Check impact-aware quality scope with synthetic Git changes
        run: python3 -m unittest discover -s tests/quality -p 'test_*.py' -v
      - name: Analyze existing real C++ translation unit
        run: |
          cmake -S . -B build/quality -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          clang-tidy-18 -p build/quality -checks=-*,clang-analyzer-* -warnings-as-errors=* tests/build_smoke.cpp
      - name: Version and specs provenance gate
        run: python3 tools/compatibility.py
      - name: Offline negative tests of parsing, migration and compatibility
        run: python3 -m unittest discover -s tests/specs -p 'test_*.py' -v
